---
# Deploy automático SAW Móveis no cPanel
# Quando você clica "Deploy HEAD Commit" no Git Version Control,
# este arquivo é executado e copia os arquivos pro public_html.
#
# IMPORTANTE: cPanel executa este arquivo do diretório do repositório
# (/home/sawmo3003/repositorios/sawmoveis-landpage/)
deployment:
  tasks:
    - export DEPLOYPATH=/home/sawmo3003/public_html
    - export SRC=/home/sawmo3003/repositorios/sawmoveis-landpage
    - /bin/rsync -av --exclude='.git' --exclude='.github' --exclude='.cpanel.yml' --exclude='README.md' --exclude='*.bak' $SRC/ $DEPLOYPATH/
    # Permissões corretas para LiteSpeed/Apache servir arquivos
    - /bin/find $DEPLOYPATH -type f -exec /bin/chmod 644 {} \;
    - /bin/find $DEPLOYPATH -type d -exec /bin/chmod 755 {} \;
    - /bin/echo "Deploy concluído em $(date) UTC" > $DEPLOYPATH/.last_deploy.txt
    - /bin/chmod 644 $DEPLOYPATH/.last_deploy.txt
