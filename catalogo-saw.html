      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 20px;

    }
    .cat-card {
      max-width: 640px;
      width: 100%;

      border: 1px solid rgba(232, 92, 26, 0.3);
      border-radius: 24px;

      text-align: center;

    }
    .cat-card__logo { max-width: 160px; margin: 0 auto 28px; display: block; }
    .cat-card__check {
      width: 80px; height: 80px; margin: 0 auto 24px;
      background: linear-gradient(135deg, #E85C1A 0%, #C04810 100%);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 36px; font-weight: 700; margin: 0 0 12px;
      color: #F46E2A; line-height: 1.1;
    }
    .cat-card__sub {
      font-size: 17px; color: #d0d0d0; margin: 0 0 32px; line-height: 1.5;
    }
    .cat-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 18px 36px;
      background: linear-gradient(135deg, #F46E2A, #E85C1A);
      color: white; text-decoration: none; border-radius: 50px;
      font-weight: 700; font-size: 17px; border: none; cursor: pointer;
      box-shadow: 0 8px 24px rgba(232,92,26,.4);
      transition: transform .2s, box-shadow .2s;
      margin-bottom: 24px;
    }
    .cat-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(232,92,26,.55); }
    .cat-divider {
      display: flex; align-items: center; gap: 16px; color: #6A6A6A;
      margin: 28px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    }
    .cat-divider::before, .cat-divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.1);
    }
    .cat-whatsapp {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 28px;
      background: #25d366; color: white; text-decoration: none;
      border-radius: 50px; font-weight: 600; font-size: 15px;
      box-shadow: 0 6px 18px rgba(37,211,102,.35);
      transition: transform .2s;
    }
    .cat-whatsapp:hover { transform: translateY(-2px); }
    .cat-extras {
      margin-top: 32px; padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: 13px; color: #888; line-height: 1.6;
    }
    .cat-extras a { color: #F46E2A; text-decoration: none; font-weight: 600; }

  <script>
    /* Personaliza saudação se nome veio na URL */
    const params = new URLSearchParams(window.location.search);
    const nome = params.get('nome') || '';
    const email = params.get('email') || '';
    const tel = params.get('telefone') || '';
    if (nome && nome !== '(sem nome)') {
      document.getElementById('nomeUser').textContent = ', ' + nome.split(' ')[0];
    }

    /* Pré-preenche WhatsApp */
    let msg = 'Olá! Acabei de baixar o catálogo da SAW Móveis pelo site.\n\n';
    if (nome && nome !== '(sem nome)') msg += '*Nome:* ' + nome + '\n';
    if (email) msg += '*E-mail:* ' + email + '\n';
    if (tel) msg += '*WhatsApp:* ' + tel + '\n';
    msg += '\nGostaria de saber mais sobre um projeto pra minha casa.';
    document.getElementById('btnWhatsApp').href = 'https://wa.me/551134959479?text=' + encodeURIComponent(msg);

    /* Tracking download */
    document.getElementById('btnDownload').addEventListener('click', function() {
      if (typeof fbq !== 'undefined') fbq('trackCustom', 'CatalogDownloaded');
      if (typeof gtag !== 'undefined') gtag('event', 'catalog_pdf_downloaded');
    });

    /* Auto-trigger download em 1.5s pro usuário não precisar clicar */
    setTimeout(() => {
      const link = document.createElement('a');
      link.href = 'catalogo-saw-moveis.pdf';
      link.download = 'Catalogo-SAW-Moveis.pdf';
      link.click();
    }, 1500);
  </script>
