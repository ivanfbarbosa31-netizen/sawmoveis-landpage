# Deploy automático do site SAW Móveis para Cloudflare Pages
# Roda toda vez que houver push na branch main
#
# Configurar Secrets no GitHub (repo sawmoveis-landpage):
#   Settings → Secrets and variables → Actions → New repository secret
#   - CLOUDFLARE_API_TOKEN  (criar em https://dash.cloudflare.com/profile/api-tokens)
#   - CLOUDFLARE_ACCOUNT_ID (fixo: 1ebc4f25ae272b526973d1b76734c826)
#
# MIGRAÇÃO: workflow FTP (Turbo Cloud/cPanel) substituído por Cloudflare Pages
# Motivo: site migrado para sawmoveis-site.pages.dev em 2026-05-28
# Responsável: Rafael (DevOps SAW)

name: Deploy site SAW → Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # permite acionar manualmente pela aba Actions

jobs:
  deploy:
    name: Deploy para Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy para Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sawmoveis-site --branch=main

      - name: Notificar sucesso
        if: success()
        run: echo "Deploy concluido em $(date) - ver https://www.sawmoveis.com.br"
